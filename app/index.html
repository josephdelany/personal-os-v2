<!doctype html>
<!-- Personal OS — the v0 daily surface (RULE-15's deterministic rendering).
     Single file, no build step, no framework. Reads ONLY public.get_day(p_day)
     (migration 0021) as the signed-in owner via Supabase magic-link auth.
     HONESTY RULES ENFORCED IN CODE:
       - renders only numerals present in the envelope (RULE-14); absence -> "not logged"
       - self-reports shown WITH their interval (ADR-0018), never a bare point
       - no streaks, no composite scores, no judgment words (RULE-23/24)
       - every number's atom_id available on hover (INV-3 traceability)
     The page contains no data and no secrets; the anon key is public-by-design
     (write-only server-side; reads require a signed-in session). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal OS — day</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; line-height: 1.45; }
  h1 { font-size: 1.15rem; } h2 { font-size: .95rem; margin: 1.4rem 0 .4rem; opacity:.75; text-transform: uppercase; letter-spacing:.04em;}
  .num { font-variant-numeric: tabular-nums; }
  .chip { display:inline-block; border:1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius:.5rem; padding:.25rem .6rem; margin:.15rem .25rem .15rem 0; }
  .muted { opacity:.6; } .warn { color:#b45309; }
  input,button { font:inherit; padding:.4rem .6rem; border-radius:.4rem; border:1px solid color-mix(in srgb, currentColor 30%, transparent); background:transparent; color:inherit;}
  button { cursor:pointer; }
  #app { margin-top:1rem; }
  .transition { transition: opacity 150ms ease-out; }
</style>
</head>
<body>
<h1>Personal OS</h1>
<div id="auth">
  <p class="muted">Sign in to read your data. (Reads are owner-only; this page holds no secrets.)</p>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
  <button id="sendlink">Send magic link</button>
  <p id="authmsg" class="muted"></p>
</div>
<div id="picker" style="display:none">
  <button id="tab-today">Today</button> <button id="tab-timeline">Timeline</button> <button id="tab-day">Day</button> <button id="tab-patterns">Patterns</button> <button id="tab-trust">Trust</button> <button id="tab-insights">Insights</button><br><br>
  <input id="day" type="date"> <button id="load">Load</button> <button id="signout" class="muted">Sign out</button>
</div>
<div id="app" class="transition"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://cykviouklidnbsbgdgdo.supabase.co";
// anon key: public-by-design (server grants make it write-only; reads need a session)
// baked in: the anon key is public-by-design (write-only server-side; every
// read RPC verifies the signed-in owner). No setup parameter needed.
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5a3Zpb3VrbGlkbmJzYmdkZ2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzA0MzYsImV4cCI6MjA5OTU0NjQzNn0.0YqUtrBMQ-6LOOIGLCj6UcqelccV2WdNVNrbEArGnk0";
const sb = createClient(SUPABASE_URL, ANON);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// deterministic renderer: emits ONLY what the envelope contains (RULE-14).
function render(env) {
  if (!env) { $("app").innerHTML = '<p class="muted">not logged</p>'; return; }
  let h = `<h2>${esc(env.day)}</h2>`;
  const ck = env.checkin || {};
  const keys = Object.keys(ck).sort();
  h += "<h2>Check-in</h2>";
  h += keys.length ? keys.map(k => {
      const v = ck[k], label = esc(k.replace(/^checkin_/, "").replace(/_/g, " "));
      return `<span class="chip num" title="atom ${esc(v.atom_id||"")}">${label}: ${esc(v.point)} <span class="muted">(${esc(v.low)}–${esc(v.high)})</span></span>`;
    }).join("") : '<p class="muted">not logged</p>';
  h += "<h2>Food & drink</h2>";
  h += (env.food && env.food.length)
    ? "<ul>" + env.food.map(f => `<li title="atom ${esc(f.atom_id||"")}">${esc(f.label)} <span class="muted num">${esc((f.at||"").slice(11,16))}${f.precision==="hour"?" ~":""}</span></li>`).join("") + "</ul>"
    : '<p class="muted">no food logged</p>';
  h += "<h2>Notes</h2>";
  h += (env.notes && env.notes.length)
    ? env.notes.map(n => `<p title="atom ${esc(n.atom_id||"")}">${esc(n.text)}</p>`).join("")
    : '<p class="muted">no note</p>';
  const c = env.coverage || {};
  h += `<h2>Trust</h2><p class="muted num">${esc(c.captures ?? 0)} captured · ${esc(c.atoms ?? 0)} facts` +
       (env.last_extract_run ? ` · last processed ${esc((env.last_extract_run.at||"").slice(0,16).replace("T"," "))} (${esc(env.last_extract_run.status)})` : "") + "</p>";
  if (c.unextracted > 0) h += `<p class="warn num">${esc(c.unextracted)} capture(s) awaiting processing</p>`;
  $("app").innerHTML = h;
}

// demo mode: ?demo=1 renders a FIXTURE envelope, loudly labeled, touching no table
// (RULE-01: fixtures never enter real data; this exercises the render path only).
if (new URLSearchParams(location.search).get("demo")) {
  $("auth").style.display = "none"; $("picker").style.display = "block";
  $("app").innerHTML = "<p class='warn'>DEMO FIXTURE — not real data</p>";
  render({ day:"2026-07-22", checkin:{ checkin_morning_energy:{point:5,low:4.5,high:5.5,atom_id:"demo"},
    checkin_morning_restored:{point:5,low:4.5,high:5.5,atom_id:"demo"}, checkin_morning_drive:{point:4,low:3.5,high:4.5,atom_id:"demo"}},
    food:[{label:"big mac",at:"2026-07-22T14:10:00Z",precision:"hour",atom_id:"demo"}],
    notes:[{text:"demo note",at:"2026-07-22T14:10:00Z",atom_id:"demo"}],
    coverage:{captures:1,atoms:4,unextracted:0},
    last_extract_run:{at:"2026-07-22T15:00:00Z",status:"ok"} });
  $("app").insertAdjacentHTML("afterbegin","<p class='warn'>DEMO FIXTURE — not real data</p>");
} else if (sb) {
  const show = (signed) => { $("auth").style.display = signed?"none":"block"; $("picker").style.display = signed?"block":"none"; };
  sb.auth.getSession().then(({data:{session}}) => { show(!!session); if (session) load(); });
  sb.auth.onAuthStateChange((_e, session) => { show(!!session); if (session) load(); });
  $("sendlink").onclick = async () => {
    const { error } = await sb.auth.signInWithOtp({ email: $("email").value, options: { emailRedirectTo: location.href.split("?")[0] } });
    $("authmsg").textContent = error ? ("error: " + error.message) : "Link sent — check your email.";
  };
  $("signout").onclick = () => sb.auth.signOut();
  $("load").onclick = () => load();
  $("tab-day").onclick = () => load();
  $("tab-today").onclick = () => loadBrief();
  $("tab-trust").onclick = () => loadTrust();
  async function loadBrief() {
    const { data, error } = await sb.rpc("get_today");
    if (error) { return loadToday(); }   // pre-0032 fallback: state-only view
    const t = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>Today · for ${esc(t.for_day)} <span class="muted">(based on ${esc(t.based_on)})</span></h2>`;
    const s2 = t.state || {};
    const g = s2.guardian;
    if (g) h += `<p class="warn num">⚠ ${esc(g.signals_firing)} autonomic signals outside band together — this combination has occurred ${esc(g.fires_historically)}× in your history. Pattern match, not a diagnosis.</p>`;
    h += "<h2>State</h2>";
    h += (s2.deviations||[]).slice(0,5).map(d => `<p class="num"><strong>${esc(d.metric)}</strong>: ${esc(d.value)} <span class="muted">(z ${esc(d.z)})</span></p>`).join("") || '<p class="muted">in your normal bands</p>';
    (s2.streaks||[]).slice(0,3).forEach(x => h += `<p class="num muted">${esc(x.metric)}: ${esc(x.run_days)}d ${esc(x.direction)} band (record ${esc(x.historical_max_run)})</p>`);
    if (t.patterns_waiting) { h += `<h2>Patterns</h2><p class="num">${esc(t.patterns_waiting.count)} exploratory patterns are waiting — <a href="#" id="go-patterns">read them on the Patterns tab</a>. <span class="muted">(pull, never pushed: exploratory content stays on its own labeled surface)</span></p>`; }
    if ((s2.week_money||[]).length) {
      h += "<h2>This week vs you</h2>";
      h += s2.week_money.slice(0,5).map(m => `<p class="num"><strong>${esc(m.name)}</strong>: $${esc(m.this_week)} vs $${esc(m.typical_week)} <strong>(${m.delta>0?"+":""}$${esc(m.delta)})</strong></p>`).join("");
    }
    if ((t.watching||[]).length) {
      h += "<h2>Watching</h2>";
      h += t.watching.map(w => `<p class="num">⏱ ${esc(w.hypothesis)} — day ${esc(w.day)}/${esc(w.of)} <span class="muted">(${esc(w.status)})</span></p>`).join("");
    }
    if ((t.forecast||[]).length) {
      h += "<h2>Forecast (tomorrow)</h2>";
      h += t.forecast.map(f => `<p class="num"><strong>${esc(f.metric)}</strong>: ${esc(f.lo)} – ${esc(f.hi)} <span class="muted">(center ${esc(f.point)})</span></p>`).join("");
      const r = t.forecast_track_record;
      if (r) h += `<p class="muted num">track record: ${esc(r.inside_band)}/${esc(r.resolved)} inside band (claimed ${esc(r.claimed_coverage)}, achieved ${esc(r.achieved_coverage)})</p>`;
    }
    $("app").innerHTML = h;
    const gp = document.getElementById("go-patterns");
    if (gp) gp.onclick = (e) => { e.preventDefault(); loadPatterns(); };
  }
  async function loadTrust() {
    const { data, error } = await sb.rpc("get_trust");
    if (error) { $("app").innerHTML = `<p class="warn">trust unavailable: ${esc(error.message)}</p>`; return; }
    const t = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>Trust — the system grading itself</h2>`;
    const f = t.forecasts || {};
    h += `<h2>Forecasts</h2><p class="num">${esc(f.inside_band??0)}/${esc(f.resolved??0)} inside band · claimed ${esc(f.claimed_coverage)} vs achieved ${esc(f.achieved_coverage??"—")} · mean Brier ${esc(f.mean_brier??"—")} · ${esc(f.pending??0)} pending</p>`;
    const hy = t.hypotheses || {};
    h += `<h2>Hypotheses</h2><p class="num">${esc(hy.candidates??0)} exploratory · ${esc(hy.watching??0)} under watch · ${esc(hy.confirmed??0)} confirmed · ${esc(hy.refuted??0)} refuted</p>`;
    h += "<h2>Scan honesty (observed vs shuffled)</h2>";
    h += (t.scan_calibration||[]).map(c => `<p class="num">${esc(c.run)}: ${esc(c.observed_sig)} of ${esc(c.tested)} observed vs shuffled-null median ${esc(c.shuffled_null_sig)}${c.null_p95!=null?` (p95 ${esc(c.null_p95)})`:""}</p>`).join("") || '<p class="muted">no scans yet</p>';
    h += "<h2>Job heartbeats</h2>";
    h += (t.job_heartbeats||[]).map(j => `<p class="num muted">${esc(j.job)}: ${esc((j.last||"").slice(0,16).replace("T"," "))} (${esc(j.status)})</p>`).join("");
    if ((t.coverage_blindspots||[]).length) {
      h += "<h2>What I cannot currently see</h2>";
      h += t.coverage_blindspots.map(b => `<p class="warn num">${esc(b.metric)} — no data since ${esc(b.last_day)}</p>`).join("");
    }
    $("app").innerHTML = h;
  }
  $("tab-timeline").onclick = () => loadTimeline();
  $("tab-patterns").onclick = () => loadPatterns();
  async function loadPatterns() {
    const { data, error } = await sb.rpc("get_patterns");
    if (error) { $("app").innerHTML = `<p class="warn">patterns unavailable: ${esc(error.message)}</p><p class="muted">(is migration 0031 applied and a scan run?)</p>`; return; }
    const env = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>Patterns · <span class="warn">${esc(env.tier)}</span></h2><p class="muted">${esc(env.disclaimer)}</p>`;
    const c = env.calibration;
    if (c) h += `<p class="num muted">honesty check (run ${esc(c.run_date)}): ${esc(c.observed_significant)} significant of ${esc(c.pairs_tested)} tested vs ${esc(c.shuffled_null_significant)} on shuffled data.</p>`;
    if ((env.keystone||[]).length) {
      h += "<h2>Keystone drivers</h2>";
      h += env.keystone.map(k => `<p class="num"><strong>${esc(k.driver)}</strong> appears in ${esc(k.patterns)} patterns across ${esc(k.outcome_families)} life domains <span class="warn">(exploratory)</span></p>`).join("");
    }
    h += "<h2>Exploratory associations</h2>";
    h += (env.patterns||[]).map(p => {
      let w = "";
      if (p.watched && p.watch_progress) {
        const wp = p.watch_progress;
        w = ` <span class="muted num">⏱ watching: day ${esc(wp.days_elapsed)}/${esc(wp.days_needed)} (${esc(wp.status)})</span>`;
      } else if (!p.watched) {
        w = ` <button data-watch="${esc(p.hypothesis_id)}" class="watchbtn">Watch this</button>`;
      }
      return `<p class="num"><span class="warn">[${esc(p.label)}]</span> ${esc(p.sentence)} <span class="muted">(n=${esc(p.n_hi)}/${esc(p.n_lo)}, n_eff≈${esc(p.n_eff?.[0])}/${esc(p.n_eff?.[1])}, q=${esc(p.q)}${p.seeded?", seeded":""})</span>${w}</p>`;
    }).join("") || '<p class="muted">no patterns surfaced yet — the weekly scan populates this.</p>';
    h += `<p class="muted">text only, by design: an exploratory association gets a sentence you must read, never a chart you can over-believe.</p>`;
    $("app").innerHTML = h;
    document.querySelectorAll(".watchbtn").forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = "registering…";
      const { error } = await sb.rpc("register_watch", { p_hypothesis_id: b.dataset.watch });
      if (error) { b.textContent = "error"; return; }
      loadPatterns();
    });
  }
  async function loadToday() {
    const day = $("day").value || null;
    const { data, error } = await sb.rpc("get_state", day ? { p_day: day } : {});
    if (error) { $("app").innerHTML = `<p class="warn">state unavailable: ${esc(error.message)}</p><p class="muted">(are migrations 0026-0030 applied and the analysis engines run?)</p>`; return; }
    const s = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>${esc(s.day)} — vs. you</h2>`;
    const g = s.guardian;
    if (g) h += `<p class="warn num">⚠ ${esc(g.signals_firing)} of your autonomic signals are outside band together (threshold ${esc(g.threshold)}). This combination has occurred ${esc(g.fires_historically)} times in your history. A pattern match, not a diagnosis.</p>`;
    h += "<h2>Deviations</h2>";
    h += (s.deviations||[]).length ? (s.deviations||[]).map(d =>
      `<p class="num"><strong>${esc(d.metric)}</strong>: ${esc(d.value)} <span class="muted">(z ${esc(d.z)}; your band ${esc(d.band?.[0])}–${esc(d.band?.[1])})</span></p>`).join("")
      : '<p class="muted">nothing unusual vs your baselines</p>';
    if ((s.streaks||[]).length) {
      h += "<h2>Streaks</h2>";
      h += s.streaks.map(x => `<p class="num"><strong>${esc(x.metric)}</strong>: ${esc(x.run_days)} days ${esc(x.direction)} your band <span class="muted">(your record: ${esc(x.historical_max_run)})</span></p>`).join("");
    }
    if ((s.week_money||[]).length) {
      h += "<h2>This week's money vs you</h2>";
      h += s.week_money.slice(0,8).map(m => `<p class="num"><strong>${esc(m.name)}</strong> <span class="muted">(${esc(m.grain)})</span>: $${esc(m.this_week)} vs $${esc(m.typical_week)} typical <strong>(${m.delta>0?"+":""}$${esc(m.delta)})</strong></p>`).join("");
    }
    h += `<p class="muted">descriptive comparisons against your own history — no judgment, no causal claim.</p>`;
    $("app").innerHTML = h;
  }
  async function loadTimeline() {
    const day = $("day").value;
    if (!day) { $("app").innerHTML = '<p class="muted">pick a date above, then Timeline — any day back to 2019.</p>'; return; }
    const { data, error } = await sb.rpc("get_timeline", { p_day: day });
    if (error) { $("app").innerHTML = `<p class="warn">timeline unavailable: ${esc(error.message)}</p>`; return; }
    const t = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>${esc(t.day)} — ${esc(t.n)} moments</h2>`;
    if (t.sleep_text) h += `<p class="muted num">${esc(t.sleep_text)}</p>`;
    const icon = {web:"🌐",video:"▶️",money:"💵",calendar:"📅",checkin:"📝",consume:"🍽",note:"✏️",workout:"🏋️",self_report:"📝"};
    h += (t.entries||[]).map(e => `<p class="num" style="margin:.15rem 0">${esc(e.at)} ${icon[e.kind]||"·"} ${esc(e.text)}</p>`).join("") || '<p class="muted">nothing recorded this day</p>';
    $("app").innerHTML = h;
  }
  $("tab-insights").onclick = () => loadInsights();
  async function loadInsights() {
    let { data, error } = await sb.rpc("get_insights_guarded");
    if (error && /does not exist/.test(error.message)) ({ data, error } = await sb.rpc("get_insights"));
    if (error) { $("app").innerHTML = `<p class="warn">insights unavailable: ${esc(error.message)}</p><p class="muted">(is migration 0023 applied?)</p>`; return; }
    const env = typeof data === "string" ? JSON.parse(data) : data;
    let h = `<h2>Insights · ${esc(env.tier)}</h2><p class="muted">${esc(env.disclaimer)}</p>`;
    if (env.stream_count) h += `<p class="num"><strong>${esc(env.fact_count)}</strong> facts across <strong>${esc(env.stream_count)}</strong> metric streams, computed live.</p>`;
    // v1-style curated rows, if present
    let dom = "";
    for (const i of (env.insights || [])) {
      if (i.domain !== dom) { dom = i.domain; h += `<h2>${esc(dom)}</h2>`; }
      h += `<p class="num"><strong>${esc(i.title)}:</strong> ${esc(i.value)} ${esc(i.unit)} <span class="muted">(n=${esc(i.n)}, ${esc(i.window)})</span></p>`;
    }
    // weekday rhythms
    const best = (env.rhythms || []).filter(r => r.is_highest);
    if (best.length) {
      h += "<h2>Weekly rhythm</h2>";
      for (const r of best) h += `<p class="num"><strong>${esc(r.metric)}</strong> peaks on <strong>${esc(r.weekday)}</strong> (median ${esc(r.median)})</p>`;
    }
    // top lists
    const L = env.lists || {};
    const listBlock = (title, arr, f) => {
      if (!arr || !arr.length) return "";
      return `<h2>${title}</h2><ol>` + arr.map(x => `<li class="num">${f(x)}</li>`).join("") + "</ol>";
    };
    h += listBlock("Top websites", L.top_sites, x => `${esc(x.site)} <span class="muted">(${esc(x.visits)} visits)</span>`);
    h += listBlock("Top YouTube channels", L.top_channels, x => `${esc(x.channel)} <span class="muted">(${esc(x.videos)} videos)</span>`);
    h += listBlock("Top merchants", L.top_merchants, x => `${esc(x.merchant)} <span class="muted">(${esc(x.txns)} txns · $${esc(x.total)})</span>`);
    h += listBlock("Spending by category", L.top_categories, x => `${esc(x.category)} <span class="muted">($${esc(x.total)} across ${esc(x.txns)})</span>`);
    // the full auto battery
    const auto = env.auto || [];
    if (auto.length) {
      h += `<h2>Every metric stream (${auto.length})</h2><p class="muted">median · p10–p90 · min–max · last 30d median · n</p>`;
      let src = "";
      for (const a of auto) {
        if (a.source !== src) { src = a.source; h += `<h2 style="opacity:.5">${esc(src)}</h2>`; }
        h += `<p class="num" style="margin:.15rem 0"><strong>${esc(a.metric)}</strong>: ${esc(a.median)} <span class="muted">· ${esc(a.p10)}–${esc(a.p90)} · ${esc(a.min)}–${esc(a.max)}${a.last30_median!=null?` · 30d ${esc(a.last30_median)}`:""} · n=${esc(a.n)}</span></p>`;
      }
    }
    h += `<p class="muted">computed live at ${esc((env.computed_at||"").slice(0,16).replace("T"," "))} — every number is a deterministic query over the recorded data.</p>`;
    $("app").innerHTML = h;
  }
  async function load() {
    const day = $("day").value || null;
    const { data, error } = await sb.rpc("get_day", day ? { p_day: day } : {});
    if (error) { $("app").innerHTML = `<p class="warn">read unavailable: ${esc(error.message)}</p><p class="muted">(is migration 0021 applied, and are you signed in?)</p>`; return; }
    render(typeof data === "string" ? JSON.parse(data) : data);
  }
}
</script>
</body>
</html>
