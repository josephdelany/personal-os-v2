<!doctype html>
<!-- Personal OS — daily surface (ADR-0165 V0, ADR-0172 lean track).
     Today / Add / History over owner-only V0 RPCs, plus Ask. No data or secrets in
     the page: the anon key is public by design and every RPC checks the owner session.
     Older exploratory views remain at explore.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Personal OS</title>
<style>
  :root {
    --bg:#f6f5f1; --surface:#ffffff; --text:#1d1d1b; --muted:#6b6a64; --line:#e3e1da;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#9a5b13; --radius:14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#141413; --surface:#1e1e1c; --text:#ecebe6; --muted:#9d9b93; --line:#33322e;
      --accent:#7cc3ad; --accent-soft:#1f3530; --warn:#e0a860; color-scheme: dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,system-ui,sans-serif;
    padding:0 16px calc(84px + env(safe-area-inset-bottom)); }
  main { max-width:34rem; margin:0 auto; }
  header { padding:20px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:1.35rem; margin:0; letter-spacing:-.01em; }
  h2 { font-size:1.1rem; margin:8px 0 12px; }
  h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 12px; }
  .day-label { color:var(--muted); margin:4px 0 12px; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .small { font-size:.85rem; }
  .missing { color:var(--muted); font-style:italic; margin:0; }
  .entries { list-style:none; padding:0; margin:0; }
  .entries li { padding:8px 0; border-top:1px solid var(--line); } .entries li:first-child { border-top:0; padding-top:0; }
  .entries p { margin:4px 0 0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .when { color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; background:var(--accent-soft); border-radius:999px; padding:3px 10px; margin:4px 4px 0 0; font-size:.9rem; }
  .scale,.unit { color:var(--muted); font-size:.8em; }
  .stat { font-variant-numeric:tabular-nums; font-weight:600; }
  .stats { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stats li { display:flex; flex-direction:column; } .stat-label { color:var(--muted); font-size:.85rem; }
  .note { color:var(--muted); font-size:.9rem; }
  button,input,select,textarea { font:inherit; color:inherit; }
  button { min-height:44px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; width:100%; }
  button.link { border:0; background:none; min-height:32px; padding:4px 0; color:var(--accent); font-size:.9rem; }
  button[aria-pressed="true"] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  input,select,textarea { width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); }
  textarea { min-height:80px; resize:vertical; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 6px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .segmented { display:flex; gap:8px; margin:0 0 12px; } .segmented button { flex:1; }
  .rating { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
  .rating button { padding:0; min-height:40px; font-variant-numeric:tabular-nums; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #add-status { margin:8px 0; } #add-status:empty { display:none; }
  #pending { border-color:var(--warn); } #pending .row { padding:6px 0; }
  .review { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .review button { font-size:.9rem; }
  #editing { background:var(--accent-soft); border-color:transparent; }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex:1; border:0; background:none; color:var(--muted); font-size:.9rem; }
  nav.tabs button[aria-current="true"] { color:var(--accent); font-weight:700; }
  .evidence { border-left:3px solid var(--accent); padding-left:10px; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:.75rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header><h1>Personal OS</h1><span><a class="muted small" href="explore.html">More</a> · <button type="button" id="signout" class="link" hidden>Sign out</button></span></header>

  <section id="auth" class="card">
    <h2>Sign in</h2>
    <form id="signin-form">
      <label for="email">Owner email</label>
      <input id="email" type="email" autocomplete="email" required>
      <p><button id="sendlink" class="primary" type="submit">Email me a sign-in link</button></p>
    </form>
    <p id="authmsg" class="muted small" role="status">Open the link in this browser. No password needed.</p>
  </section>

  <div id="signed-in" hidden>
    <section id="pending" class="card" hidden aria-live="polite"></section>
    <p id="add-status" role="status" aria-live="polite"></p>

    <section id="panel-today">
      <div id="today-view"></div>
    </section>

    <section id="panel-add" hidden>
      <div class="segmented" role="group" aria-label="What to add">
        <button type="button" data-add="checkin" aria-pressed="true">Check-in</button>
        <button type="button" data-add="meal" aria-pressed="false">Meal</button>
        <button type="button" data-add="workout" aria-pressed="false">Set</button>
      </div>
      <div id="editing" class="card" hidden><p id="editing-text" class="small" style="margin:0"></p><button type="button" id="cancel-edit" class="link">Cancel correction</button></div>

      <form id="form-checkin" class="entry card">
        <label for="ci-period">Check-in</label>
        <select id="ci-period"><option value="morning">Morning</option><option value="evening">Evening</option></select>
        <div id="ci-sleep-row"><label>Sleep quality (1–10)</label><div class="rating" data-key="sleep_quality" role="group" aria-label="Sleep quality"></div></div>
        <div id="ci-mood-row" hidden><label>Mood (1–10)</label><div class="rating" data-key="mood" role="group" aria-label="Mood"></div></div>
        <label>Energy (1–10)</label><div class="rating" data-key="energy" role="group" aria-label="Energy"></div>
        <label for="ci-note">Note (optional)</label><textarea id="ci-note" maxlength="4000"></textarea>
        <p><button class="primary" type="submit">Save check-in</button></p>
      </form>

      <form id="form-meal" class="entry card" hidden>
        <label for="meal-text">What did you eat or drink?</label>
        <textarea id="meal-text" maxlength="10000" placeholder="e.g. two eggs, toast, black coffee"></textarea>
        <p class="muted small">Photos go through the iPhone Shortcut.</p>
        <p><button class="primary" type="submit">Save meal</button></p>
      </form>

      <form id="form-workout" class="entry card" hidden>
        <label for="wo-exercise">Exercise</label><input id="wo-exercise" maxlength="200" autocomplete="off">
        <label for="wo-mode">Type</label>
        <select id="wo-mode"><option value="external_load">Weighted</option><option value="bodyweight">Bodyweight</option><option value="assisted">Assisted</option></select>
        <div id="wo-load-row" class="pair">
          <div><label for="wo-load">Load</label><input id="wo-load" type="number" inputmode="decimal" min="0" step="any"></div>
          <div><label for="wo-unit">Unit</label><select id="wo-unit"><option>lb</option><option>kg</option></select></div>
        </div>
        <div class="pair">
          <div><label for="wo-reps">Reps</label><input id="wo-reps" type="number" inputmode="numeric" min="1" step="1"></div>
          <div><label for="wo-rpe">RPE (optional)</label><input id="wo-rpe" type="number" inputmode="decimal" min="0" max="10" step="0.5"></div>
        </div>
        <label for="wo-note">Note (optional)</label><textarea id="wo-note" maxlength="4000"></textarea>
        <p><button class="primary" type="submit">Save set</button></p>
      </form>
    </section>

    <section id="panel-history" hidden>
      <label for="history-date">Day</label><input id="history-date" type="date">
      <div id="history-view" style="margin-top:12px"></div>
    </section>

    <section id="panel-ask" hidden class="card">
      <h2>Ask</h2>
      <p class="muted small">Answers come from saved records. Missing records are never treated as zero.</p>
      <form id="ask-form">
        <label for="question">Question</label>
        <input id="question" required maxlength="2000" autocomplete="off">
        <label for="ask-date">As of (optional)</label><input id="ask-date" type="date">
        <p><button id="ask-submit" class="primary" type="submit">Ask</button></p>
      </form>
      <div id="ask-answer" aria-live="polite"></div>
    </section>
  </div>
</main>

<nav class="tabs" id="tabs" hidden aria-label="Sections">
  <button type="button" id="tab-today" aria-current="true">Today</button>
  <button type="button" id="tab-add" aria-current="false">Add</button>
  <button type="button" id="tab-history" aria-current="false">History</button>
  <button type="button" id="tab-ask" aria-current="false">Ask</button>
</nav>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { mountAsk } from './ask.mjs';
import { mountDaily } from './daily.mjs';
const SUPABASE_URL = "https://cykviouklidnbsbgdgdo.supabase.co";
// Public anon key: every owner RPC verifies the signed-in session.
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5a3Zpb3VrbGlkbmJzYmdkZ2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzA0MzYsImV4cCI6MjA5OTU0NjQzNn0.0YqUtrBMQ-6LOOIGLCj6UcqelccV2WdNVNrbEArGnk0";
const sb = createClient(SUPABASE_URL, ANON);
const $ = id => document.getElementById(id);
const rpc = (name, args) => sb.rpc(name, args);
let storage = null;
try { storage = window.localStorage; } catch { /* unsaved retries stay in memory */ }

const ask = mountAsk({form: $('ask-form'), input: $('question'), date: $('ask-date'),
  button: $('ask-submit'), output: $('ask-answer'), rpc});
const daily = mountDaily({dom: document, rpc, storage});

let signedIn = null;
function show(signed) {
  if (signed === signedIn) return;
  signedIn = signed;
  $('auth').hidden = signed; $('signed-in').hidden = !signed; $('tabs').hidden = !signed; $('signout').hidden = !signed;
  if (signed) setTimeout(() => daily.openTab('today'), 0); // leave the auth callback first
  else ask.reset();
}
sb.auth.getSession().then(({data: {session}}) => show(!!session));
sb.auth.onAuthStateChange((_e, session) => show(!!session));
$('signout').onclick = () => sb.auth.signOut();
$('signin-form').onsubmit = async event => {
  event.preventDefault();
  if ($('sendlink').disabled) return;
  $('sendlink').disabled = true;
  $('authmsg').textContent = 'Requesting your sign-in link…';
  try {
    const {error} = await sb.auth.signInWithOtp({email: $('email').value.trim(),
      options: {shouldCreateUser: false, emailRedirectTo: location.href.split('?')[0].split('#')[0]}});
    $('authmsg').textContent = error ? 'Could not send the link. Check the email and try again.'
      : 'Check your inbox and open the link in this browser.';
  } catch { $('authmsg').textContent = 'Could not reach sign-in. Check your connection.'; }
  finally { $('sendlink').disabled = false; }
};
</script>
</body>
</html>
