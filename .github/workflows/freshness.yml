# freshness — is data still arriving? (REQ-NFR-005..012, Gate 4)
#
# This is deliberately its own workflow rather than a step inside `analysis`. On 2026-07-28
# device-side capture stopped and stayed stopped for 43 days while every scheduled job kept
# writing `status = 'ok'` rows, because the jobs were alive and only their inputs were dead.
# A freshness check that runs as a step of the pipeline it is meant to audit shares that
# pipeline's fate: if `analysis` fails early, the check never runs, and the silence looks the
# same as health. It therefore runs on its own schedule, depends on nothing, and is allowed to
# fail loudly — a red run here is the alert.
#
# It runs BEFORE the nightly analysis refresh, so it reports on the day that has actually
# landed rather than on a panel rebuilt seconds earlier.
#
# NOT RUNNING AS OF 2026-09-11 — measured, not suspected (ADR-0140).
#
#   ops.runs carries exactly ONE check_freshness row, ever: 2026-09-09 22:40 UTC, which was a
#   manual local run. None on the 10th, none on the 11th, while `analysis` and `keepalive`
#   wrote rows on both days.
#
#   The cause is not this file's contents. `gh api repos/:owner/:repo/actions/workflows` lists
#   six workflows and `freshness` is not among them, and
#   `gh api "repos/:owner/:repo/contents/.github/workflows?ref=v2-day1"` returns
#   analysis / extract / gates / keepalive / pages — five files. This one has never reached the
#   repository's DEFAULT branch, which is `v2-day1`, not `main`, and GitHub delivers `schedule`
#   events only from the default branch. The last push to the remote was 2026-09-03.
#
#   So the single mechanism built to stop a repeat of the 43-day silent capture failure has
#   never fired on a schedule. It was implemented and tested; it was never deployed, and
#   nothing in the repository could tell the difference — which is the same class of error as
#   the one it exists to catch, one level up.
#
#   The fix is a deployment act and is Joe's / the integration owner's: either move the
#   default branch to the branch that carries this file, or push this file to `v2-day1`.
#   Verification is in docs/CAPTURE_ACTIVATION.md and is two commands, neither of which is
#   "the workflow file exists".
#
# REGISTRATION NOTE. Even once the file is on the default branch, GitHub does not index a
# workflow whose only triggers are `schedule` and `workflow_dispatch` when it merely rides
# along in a bulk push — keepalive.yml's own header records this happening to it. A push that
# MODIFIES the file forces a re-scan. These comment lines are that modification.
name: freshness
on:
  schedule:
    - cron: '10 8 * * *'    # daily 08:10 UTC (~4:10am ET), ahead of analysis at 08:23
  workflow_dispatch: {}
concurrency: { group: freshness, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pg8000>=1.30,<2'
      - name: feed freshness (fails the run when a source has gone quiet)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        # The command exits 1 when any registered metric is past its staleness limit
        # (REQ-NFR-007) and 2 when the database is unreachable (REQ-NFR-009). Both are
        # failures and both should be: a quiet feed is the thing this workflow exists to
        # notice, and GitHub's own failure notification is the alert channel — no third
        # party, no recurring cost (RULE-28).
        run: python3 tools/check_freshness.py
