# pages — deploy the v0 daily surface (app/index.html) to GitHub Pages.
# The page is pure code: no data, no secrets (the anon key is entered by Joe at
# runtime and kept in his browser's localStorage). Reads require his signed-in
# session; RULE-29 is untouched (data flows Joe's-browser <-> Supabase only).
name: pages
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deployment
        uses: actions/deploy-pages@v4
