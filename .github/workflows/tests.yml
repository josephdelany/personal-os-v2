# tests — the full pytest suite against the live database, nightly and on every push to main (ADR-0049 (g)).
# Runs the sanctioned ledger writer (tools/update_features.py --strict), which runs the WHOLE suite, moves
# ops/features.json entries failing -> passing only on a named passing test, and exits 1 on any failure.
# If the ledger changed, a bot commit records it (same pattern as keepalive's heartbeat commit).
name: tests
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'    # nightly 09:00 UTC, after the analysis refresh
  workflow_dispatch: {}
concurrency: { group: tests, cancel-in-progress: false }
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # B9's specification curve makes the suite materially longer
    permissions:
      contents: write        # only for the ops/features.json ledger commit
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # B13 (ADR-0059) adds PyYAML and ofxtools. PyYAML reads the per-institution CSV mappings
      # REQ-FIN-014 requires; ofxtools parses OFX/QFX/QBO, which REQ-FIN-013 mandates by name
      # (its Direct-Connect fetch client is never used). Both MIT, pure Python, no service, no
      # network use at runtime, $0 recurring with no overage surface.
      - run: pip install 'pg8000>=1.30,<2' 'pytest>=8,<9' 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<0.15' 'networkx>=3,<4' 'pyyaml>=6,<7' 'ofxtools>=0.9,<1'
      - name: full suite via the ledger writer (fails on any test failure)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/update_features.py --strict
      - name: commit the ledger if it moved
        if: always()
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ops/features.json; then
            git config user.name  "features-bot"
            git config user.email "features@users.noreply.github.com"
            git add ops/features.json
            git commit -m "chore: features ledger moved by a named passing test (tools/update_features.py, ADR-0011)"
            git push
          else
            echo "ledger unchanged"
          fi

  # The SQL-behaviour tests build a spine from the real migrations and execute production SQL.
  # They run on a disposable local PostgreSQL 17 server (ADR-0082) rather than against the
  # production instance: hundreds of DDL statements per test is minutes of network round trips
  # remotely and under a second locally, and it leaves production entirely DDL-free. The
  # `pytest` job above skips them for that reason; this job is where they actually run, so
  # gating them is not the same as losing them.
  #
  # RULE-29 note: the PGDG fallback below fetches a package signing key from postgresql.org.
  # That is a CI runner installing a build dependency, not this system emitting personal data,
  # and no row, coordinate or credential is involved. It is attempted only if the runner image
  # does not already carry PostgreSQL 17.
  local-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pg8000>=1.30,<2' 'pytest>=8,<9' 'pyyaml>=6,<7' 'ofxtools>=0.9,<1'
      - name: ensure PostgreSQL 17 binaries
        run: |
          set -euo pipefail
          if [ -x /usr/lib/postgresql/17/bin/initdb ]; then
            echo "PostgreSQL 17 already present"
          else
            sudo apt-get update -qq
            if ! sudo apt-get install -y -qq postgresql-17; then
              . /etc/os-release
              sudo sh -c "echo 'deb https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
              sudo wget -qO /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg /tmp/pgdg.asc
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-17
            fi
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: disposable-server SQL suite
        # No SUPABASE_DB_URL is provided. The runner starts its own temporary server with TCP
        # disabled; these tests must never be able to reach production.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/test_local_sql.py
