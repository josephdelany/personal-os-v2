# tests — the full pytest suite against the live database, nightly and on every push to main (ADR-0049 (g)).
# Runs the sanctioned ledger writer (tools/update_features.py --strict), which runs the WHOLE suite, moves
# ops/features.json entries failing -> passing only on a named passing test, and exits 1 on any failure.
# If the ledger changed, a bot commit records it (same pattern as keepalive's heartbeat commit).
name: tests
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'    # nightly 09:00 UTC, after the analysis refresh
  workflow_dispatch: {}
concurrency: { group: tests, cancel-in-progress: false }
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # B9's specification curve makes the suite materially longer
    permissions:
      contents: write        # only for the ops/features.json ledger commit
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'} # ADR-0143: built-in Web API tests, no npm dependencies
      # B13 (ADR-0059) adds PyYAML and ofxtools. PyYAML reads the per-institution CSV mappings
      # REQ-FIN-014 requires; ofxtools parses OFX/QFX/QBO, which REQ-FIN-013 mandates by name
      # (its Direct-Connect fetch client is never used). Both MIT, pure Python, no service, no
      # network use at runtime, $0 recurring with no overage surface.
      # dateparser (ADR-0115): `extraction.py` imports it INSIDE resolve_event_time with no
      # guard, so without it every capture carrying a temporal span raises ImportError here —
      # an error, not a skip. jax/jaxlib/numpyro (ADR-0103, ADR-0133): the second, independent
      # posterior implementation. It was allowed to skip while this file never installed it,
      # so REQ-INF-520 was counted as proven by a test that had run in no CI job ever. Pinned
      # to the 0.4.x line ADR-0103 records as verified. All pip-only, no service, no network at
      # runtime, $0 recurring with no overage surface (RULE-28).
      #
      # pyarrow is deliberately NOT here: it is imported only by tools/backfill_run.py, a
      # one-off local reader for the legacy parquet snapshot, and no test imports it.
      - run: pip install 'pg8000>=1.30,<2' 'pytest>=8,<9' 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<0.15' 'networkx>=3,<4' 'pyyaml>=6,<7' 'ofxtools>=0.9,<1' 'dateparser>=1.2,<2' 'jax==0.4.30' 'jaxlib==0.4.30' 'numpyro>=0.19,<0.20'
      - name: full suite via the ledger writer (fails on any test failure)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
          # tests/conftest.py: a test that steps aside because a LIBRARY is missing FAILS here.
          # CI is the environment where nothing is missing, so a dependency skip in this job is
          # a hole in the evidence, not a tolerable condition. Skips about absent DATA are
          # unaffected — no package installs a row.
          PERSONAL_OS_REQUIRE_DEPS: '1'
        run: python3 tools/update_features.py --strict
      # The result file existed only inside the runner and died with it, so the evidence tools
      # -- which refuse to run without one -- had nothing from CI to read and the "635 of 685"
      # figure could only ever be reproduced by hand on a developer machine. `if: always()`
      # because a failing suite is the run whose evidence matters most.
      - name: record the run
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 tools/evidence_manifest.py --report /tmp/features_junit.xml --suite live \
            --out ops/evidence/live.json
      - name: upload the live-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-live
          path: |
            /tmp/features_junit.xml
            ops/evidence/live.json
          if-no-files-found: warn
          retention-days: 90
      - name: commit the ledger if it moved
        if: always()
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ops/features.json; then
            git config user.name  "features-bot"
            git config user.email "features@users.noreply.github.com"
            git add ops/features.json
            git commit -m "chore: features ledger moved by a named passing test (tools/update_features.py, ADR-0011)"
            git push
          else
            echo "ledger unchanged"
          fi

  # The SQL-behaviour tests build a spine from the real migrations and execute production SQL.
  # They run on a disposable local PostgreSQL 17 server (ADR-0082) rather than against the
  # production instance: hundreds of DDL statements per test is minutes of network round trips
  # remotely and under a second locally, and it leaves production entirely DDL-free. The
  # `pytest` job above skips them for that reason; this job is where they actually run, so
  # gating them is not the same as losing them.
  #
  # RULE-29 note: the PGDG fallback below fetches a package signing key from postgresql.org.
  # That is a CI runner installing a build dependency, not this system emitting personal data,
  # and no row, coordinate or credential is involved. It is attempted only if the runner image
  # does not already carry PostgreSQL 17.
  local-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # dateparser is here because it is present on the development machine, so a green
      # local-sql run here does NOT prove this job stays green without it. `extraction.py`
      # imports it inside resolve_event_time with no guard, so any test in the TESTS tuple that
      # reaches a temporal span raises ImportError rather than skipping. Cheaper to install the
      # 0.3 MB package (ADR-0115, already installed in the pytest job) than to rely on nothing
      # in that tuple ever touching that path.
      - run: pip install 'pg8000>=1.30,<2' 'pytest>=8,<9' 'pyyaml>=6,<7' 'ofxtools>=0.9,<1' 'dateparser>=1.2,<2'
      - name: ensure PostgreSQL 17 binaries
        run: |
          set -euo pipefail
          if [ -x /usr/lib/postgresql/17/bin/initdb ]; then
            echo "PostgreSQL 17 already present"
          else
            sudo apt-get update -qq
            if ! sudo apt-get install -y -qq postgresql-17; then
              . /etc/os-release
              sudo sh -c "echo 'deb https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
              sudo wget -qO /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg /tmp/pgdg.asc
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-17
            fi
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: disposable-server SQL suite
        # No SUPABASE_DB_URL is provided. The runner starts its own temporary server with TCP
        # disabled; these tests must never be able to reach production.
        env:
          PYTHONPATH: ${{ github.workspace }}
          # A library missing in THIS job is a hole in the evidence too. tools/test_local_sql.py
          # defaults this on; it is stated here so the workflow says what it relies on.
          PERSONAL_OS_REQUIRE_DEPS: '1'
        run: python3 tools/test_local_sql.py --junitxml=/tmp/local_sql_junit.xml
      - name: record the run
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 tools/evidence_manifest.py --report /tmp/local_sql_junit.xml --suite local-sql \
            --out ops/evidence/local-sql.json
      - name: upload the disposable-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-local-sql
          path: |
            /tmp/local_sql_junit.xml
            ops/evidence/local-sql.json
          if-no-files-found: warn
          retention-days: 90
