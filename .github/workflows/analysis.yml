# analysis — nightly conversation-layer refresh (ADR-0038): panel -> baselines.
# Deterministic, $0, heartbeated to ops.runs. Weekly scan job joins here (U5).
name: analysis
on:
  schedule:
    - cron: '23 8 * * *'    # nightly 08:23 UTC (~4:23am ET, after data lands)
  workflow_dispatch: {}
concurrency: { group: analysis, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pg8000>=1.30,<2'
      - name: panel + baselines refresh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/run_analysis.py
  resolve:
    # ADR-0048: nightly watch resolver — after the panel refresh; its own job so a failure
    # (e.g. migration 0042 not yet applied) cannot take the Monday scan down with it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # B9 (ADR-0050/0051): the specification curve needs scipy, the confirmation gate statsmodels and
      # networkx. All three are free libraries, pinned; no service, no recurring cost (RULE-28).
      # B19 §G.2 (REQ-INF-520) names NumPyro. Pinned below 0.5 because jax dropped macOS
      # x86_64 wheels after 0.4.38, and the model has to run on the machine it is written on as
      # well as in CI — ADR-0103's amendment recorded that as impossible and was wrong twice.
      #
      # B16 §C.3 (REQ-CAP-064) names dateparser: the model emits the verbatim temporal SPAN and
      # never a timestamp, so something has to resolve it. 0.3 MB, pure Python, BSD, no service
      # and no runtime network call. Installed and exercised locally before this line was added
      # (ADR-0103's amendment: a dependency ADR from package metadata is a plan, not evidence).
      - run: pip install 'pg8000>=1.30,<2' 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<0.15' 'networkx>=3,<4' 'dateparser>=1.2,<2' 'jax>=0.4.30,<0.5' 'jaxlib>=0.4.30,<0.5' 'numpyro>=0.19,<0.21'
      - name: resolve matured watches
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/run_resolve.py
      - name: confirmation gate (ADR-0050 / ADR-0051) — PROMOTED -> CONFIRMED, re-checks, prediction scoring
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/run_confirm.py
      - name: recommendations (ADR-0052) — score, withdraw, generate, pick the one daily instruction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/run_recommend.py
      # Reconstruction (ADR-0134/0135). Runs EVERY REGISTERED method rather than a hardcoded
      # one, because RULE-13 makes the registry the list — adding a method is a migration, not
      # an edit here. Today this is a clean no-op in production: 0064/0067 are unapplied, so
      # `config.reconstruction_methods` is empty and the runner exits 0 saying so. That is the
      # rule being obeyed, not a failure, and it must not turn the nightly red while OQ-77 is
      # open. The step is wired NOW so that applying the migrations is all that is left —
      # a capability nothing ever runs is the exact failure ADR-0134 documents.
      - name: reconstruction — every registered method (no-op while none is registered)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 tools/reconstruct_run.py --all-methods --commit
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule')
    needs: refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pg8000>=1.30,<2'
      - name: weekly contrast scan (Mondays; full sweep + null twin)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/run_scan.py
          else
            echo "not Monday — scan skipped (nightly refresh only)"
          fi
